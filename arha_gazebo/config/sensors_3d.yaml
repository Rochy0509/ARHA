sensors:
  # Chest camera point cloud for collision detection
  - sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
    point_cloud_topic: /camera_chest/depth/points
    max_range: 3.0
    point_subsample: 1
    padding_offset: 0.02
    padding_scale: 1.0
    max_update_rate: 2.0
    filtered_cloud_topic: filtered_cloud_chest

  # Left wrist camera point cloud
  - sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
    point_cloud_topic: /camera_left_wrist/depth/points
    max_range: 1.5
    point_subsample: 1
    padding_offset: 0.01
    padding_scale: 1.0
    max_update_rate: 2.0
    filtered_cloud_topic: filtered_cloud_left

  # Right wrist camera point cloud
  - sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
    point_cloud_topic: /camera_right_wrist/depth/points
    max_range: 1.5
    point_subsample: 1
    padding_offset: 0.01
    padding_scale: 1.0
    max_update_rate: 2.0
    filtered_cloud_topic: filtered_cloud_right
