controller_manager:
  ros__parameters:
    update_rate: 1000  # Match physics update rate for high-frequency control
    
    # Controller list
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      
    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      
    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Joint State Broadcaster - publishes all joint states
joint_state_broadcaster:
  ros__parameters:
    joints:
      - ShoulderLU_joint
      - ShoulderLD_joint
      - ElbowLU_joint
      - ElbowLD_joint
      - WristLU_joint
      - WristLD_joint
      - ShoulderRU_joint
      - ShoulderRD_joint
      - ElbowRU_joint
      - ElbowRD_joint
      - WristRU_joint
      - WristRD_joint
      - left_cam_joint
      - right_cam_joint

# Left Arm Controller
left_arm_controller:
  ros__parameters:
    joints:
      - ShoulderLU_joint
      - ShoulderLD_joint
      - ElbowLU_joint
      - ElbowLD_joint
      - WristLU_joint
      - WristLD_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true

    # PID gains for position control
    gains:
      ShoulderLU_joint: {p: 1000.0, d: 50.0, i: 0.1, i_clamp: 10.0}
      ShoulderLD_joint: {p: 1000.0, d: 50.0, i: 0.1, i_clamp: 10.0}
      ElbowLU_joint: {p: 800.0, d: 40.0, i: 0.1, i_clamp: 10.0}
      ElbowLD_joint: {p: 800.0, d: 40.0, i: 0.1, i_clamp: 10.0}
      WristLU_joint: {p: 500.0, d: 30.0, i: 0.1, i_clamp: 10.0}
      WristLD_joint: {p: 500.0, d: 30.0, i: 0.1, i_clamp: 10.0}

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0

# Right Arm Controller
right_arm_controller:
  ros__parameters:
    joints:
      - ShoulderRU_joint
      - ShoulderRD_joint
      - ElbowRU_joint
      - ElbowRD_joint
      - WristRU_joint
      - WristRD_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true

    # PID gains for position control
    gains:
      ShoulderRU_joint: {p: 1000.0, d: 50.0, i: 0.1, i_clamp: 10.0}
      ShoulderRD_joint: {p: 1000.0, d: 50.0, i: 0.1, i_clamp: 10.0}
      ElbowRU_joint: {p: 800.0, d: 40.0, i: 0.1, i_clamp: 10.0}
      ElbowRD_joint: {p: 800.0, d: 40.0, i: 0.1, i_clamp: 10.0}
      WristRU_joint: {p: 500.0, d: 30.0, i: 0.1, i_clamp: 10.0}
      WristRD_joint: {p: 500.0, d: 30.0, i: 0.1, i_clamp: 10.0}

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0

# Left Gripper Controller
left_gripper_controller:
  ros__parameters:
    joints:
      - left_cam_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

    # PID gains for gripper control
    gains:
      left_cam_joint: {p: 200.0, d: 10.0, i: 0.1, i_clamp: 5.0}

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0

# Right Gripper Controller
right_gripper_controller:
  ros__parameters:
    joints:
      - right_cam_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

    # PID gains for gripper control
    gains:
      right_cam_joint: {p: 200.0, d: 10.0, i: 0.1, i_clamp: 5.0}

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
