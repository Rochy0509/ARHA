controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_impedance_controller:
      type: arha_controllers/JointImpedanceController

    right_arm_impedance_controller:
      type: arha_controllers/JointImpedanceController

left_arm_impedance_controller:
  ros__parameters:
    joints:
      - ShoulderLU_joint
      - ShoulderLD_joint
      - ElbowLU_joint
      - ElbowLD_joint
      - WristLU_joint
      - WristLD_joint
    # Conservative gains for Gazebo
    kp: [100.0, 100.0, 80.0, 80.0, 50.0, 50.0]
    kd: [5.0, 5.0, 4.0, 4.0, 2.0, 2.0]

right_arm_impedance_controller:
  ros__parameters:
    joints:
      - ShoulderRU_joint
      - ShoulderRD_joint
      - ElbowRU_joint
      - ElbowRD_joint
      - WristRU_joint
      - WristRD_joint
    # Conservative gains for Gazebo
    kp: [100.0, 100.0, 80.0, 80.0, 50.0, 50.0]
    kd: [5.0, 5.0, 4.0, 4.0, 2.0, 2.0]
