name: ARHA ROS2 CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  ROS_DISTRO: humble

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint (C++ & Python)
  # ─────────────────────────────────────────────
  lint:
    name: Lint (ament_cpplint & flake8)
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Needed for realtime_tools submodule

      - name: Install lint tools
        run: |
          apt-get update && apt-get install -y \
            python3-pip \
            python3-ament-cpplint \
            python3-ament-flake8 \
            --no-install-recommends
          pip3 install flake8

      - name: Run ament_cpplint (C++)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          find arha_hardware_interface arha_moveit2 arha_tcp_driver \
            -name "*.cpp" -o -name "*.hpp" -o -name "*.h" 2>/dev/null | \
            xargs --no-run-if-empty ament_cpplint --linelength=100
        continue-on-error: true

      - name: Run flake8 (Python)
        shell: bash
        run: |
          pip3 install flake8 --quiet
          find arha_description arha_gazebo arha_moveit2 \
            -name "*.py" 2>/dev/null | \
            xargs --no-run-if-empty flake8 --max-line-length=100
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 2: Build & Test all ARHA packages
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test (ROS2 Humble)
    runs-on: ubuntu-22.04
    needs: lint
    container:
      image: ros:humble-ros-base-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Pulls in realtime_tools @ b06ad8e
          path: ros2_ws/src/arha

      - name: Clone robotiq_hande_description
        run: |
          git clone https://github.com/Rochy0509/robotiq_hande_description.git ros2_ws/src/robotiq_hande_description

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y \
            python3-pip \
            python3-rosdep \
            python3-colcon-common-extensions \
            python3-vcstool \
            ros-humble-moveit \
            ros-humble-ros2-control \
            ros-humble-ros2-controllers \
            ros-humble-hardware-interface \
            ros-humble-controller-manager \
            ros-humble-gazebo-ros-pkgs \
            ros-humble-gazebo-ros2-control \
            ros-humble-robot-state-publisher \
            ros-humble-joint-state-publisher \
            ros-humble-joint-state-publisher-gui \
            ros-humble-xacro \
            ros-humble-rviz2 \
            --no-install-recommends

      - name: Run rosdep install
        run: |
          rosdep update
          cd ros2_ws
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro humble \
            -y || true

      - name: Build — arha_description
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build \
            --packages-select arha_description \
            --symlink-install \
            --event-handlers console_cohesion+

      - name: Build — arha_gazebo
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          cd ros2_ws
          colcon build \
            --packages-select arha_gazebo \
            --symlink-install \
            --event-handlers console_cohesion+

      - name: Build — arha_hardware_interface
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          cd ros2_ws
          colcon build \
            --packages-select arha_hardware_interface \
            --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            --event-handlers console_cohesion+

      - name: Build — arha_tcp_driver
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          cd ros2_ws
          colcon build \
            --packages-select arha_tcp_driver \
            --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            --event-handlers console_cohesion+

      - name: Build — arha_moveit2
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          cd ros2_ws
          colcon build \
            --packages-select arha_moveit2 \
            --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            --event-handlers console_cohesion+

      - name: Run all tests (colcon test)
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          cd ros2_ws
          colcon test \
            --packages-select \
              arha_description \
              arha_gazebo \
              arha_hardware_interface \
              arha_tcp_driver \
              arha_moveit2 \
            --event-handlers console_cohesion+ \
            --return-code-on-test-failure
        continue-on-error: true

      - name: Show test results
        if: always()
        run: |
          cd ros2_ws
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-humble
          path: ros2_ws/build/*/test_results/**/*.xml
          retention-days: 14

  # ─────────────────────────────────────────────
  # Job 3: Hardware Interface & TCP Driver check
  # ─────────────────────────────────────────────
  hardware-interface-check:
    name: Hardware Interface & TCP Driver Check
    runs-on: ubuntu-22.04
    needs: build-and-test
    container:
      image: ros:humble-ros-base-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ros2_ws/src/arha

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            ros-humble-ros2-control \
            ros-humble-hardware-interface \
            ros-humble-controller-manager \
            python3-colcon-common-extensions \
            --no-install-recommends

      - name: rosdep install
        run: |
          rosdep update
          cd ros2_ws
          rosdep install --from-paths src --ignore-src --rosdistro humble -y

      - name: Build hardware_interface + tcp_driver (Debug + compile_commands)
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build \
            --packages-select arha_hardware_interface arha_tcp_driver \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            --event-handlers console_cohesion+

      - name: Verify packages are discoverable by ROS2
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          ros2 pkg list | grep arha

      - name: Upload compile_commands.json (for static analysis / IDE)
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands
          path: ros2_ws/build/*/compile_commands.json
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 4: MoveIt2 Config & URDF Validation
  # ─────────────────────────────────────────────
  moveit-validation:
    name: MoveIt2 Config & URDF Validation
    runs-on: ubuntu-22.04
    needs: build-and-test
    container:
      image: ros:humble-ros-base-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ros2_ws/src/arha

      - name: Install MoveIt2 + description tools
        run: |
          apt-get update && apt-get install -y \
            ros-humble-moveit \
            ros-humble-moveit-ros-planning \
            ros-humble-moveit-ros-move-group \
            ros-humble-xacro \
            ros-humble-robot-state-publisher \
            ros-humble-urdf \
            liburdfdom-tools \
            python3-colcon-common-extensions \
            --no-install-recommends

      - name: rosdep install
        run: |
          rosdep update
          cd ros2_ws
          rosdep install --from-paths src --ignore-src --rosdistro humble -y

      - name: Build arha_description + arha_moveit2
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build \
            --packages-select arha_description arha_moveit2 \
            --symlink-install \
            --event-handlers console_cohesion+

      - name: Validate URDF/XACRO files
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          find ros2_ws/src/arha/arha_description -name "*.urdf" | while read f; do
            echo "Checking URDF: $f"
            check_urdf "$f" && echo "OK" || echo "FAILED: $f"
          done
          find ros2_ws/src/arha/arha_description -name "*.urdf.xacro" | while read f; do
            echo "Checking XACRO: $f"
            xacro "$f" | check_urdf && echo "OK" || echo "FAILED: $f"
          done
        continue-on-error: true